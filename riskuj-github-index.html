<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riskuj! – bezplatné demo</title><style>body{font:16px system-ui;background:#091a3c;color:white;margin:0;padding:24px}main{max-width:1050px;margin:auto}h1{color:#ffd465}button,input,select{font:inherit;padding:12px;border-radius:8px;border:0}button{cursor:pointer;background:#f5bf44;color:#142449;font-weight:700}button:disabled{opacity:.35;cursor:default}.panel{background:#172e5a;padding:18px;border-radius:14px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.board button{min-height:65px;background:#2855a3;color:#fff}.score{font-size:23px;font-weight:bold}.muted{color:#aabde1}.warn{color:#ffb9b9}input{max-width:100%;box-sizing:border-box}#answer{width:100%}@media(max-width:600px){.grid{grid-template-columns:1fr}.board button{min-height:50px}}</style></head><body><main><h1>RISKUJ! <small style="font-size:14px;color:#b7c9ee">bezplatné demo</small></h1><p class="muted">Samostatná ukážka v prehliadači, bez inštalácie, účtu a API. Telefóny zatiaľ nie sú prepojené.</p><div id="setup" class="panel"><h2>Nastavenie hry</h2><div class="grid"><input id="p0" value="Hráč 1" aria-label="Hráč 1"><input id="p1" value="Hráč 2" aria-label="Hráč 2"><input id="p2" value="Hráč 3" aria-label="Hráč 3"></div><p>Čas na písanú odpoveď: <input type="number" id="seconds" value="15" min="5" max="120" style="width:90px"> sekúnd</p><button onclick="start()">Spustiť demo</button></div><div id="game" hidden><div id="scores" class="grid"></div><div id="board" class="panel"></div><div id="question" class="panel" hidden><h2 id="prompt"></h2><p id="info"></p><div id="buzz" class="grid"></div><div id="entry" hidden><p id="who"></p><input id="answer" placeholder="Napíš odpoveď" autocomplete="off"><button onclick="submit()">Odoslať odpoveď</button></div><div id="review" hidden><p id="feedback"></p><button onclick="grade(true)">Uznať</button> <button onclick="grade(false)">Neuznať</button></div><p id="result"></p></div><button onclick="reset()">Nová hra</button></div></main><script>
const questions=[['Geografia',100,'Aké je hlavné mesto Slovenska?','Bratislava',['bratislava']],['Geografia',200,'Ktorý oceán je najväčší?','Tichý oceán',['tichy ocean','pacifik']],['História',100,'V ktorom roku vznikla Československá republika?','1918',['1918']],['História',200,'Kto bol prvým prezidentom ČSR?','Tomáš Garrigue Masaryk',['masaryk','tomas garrigue masaryk']],['Veda',100,'Aká je chemická značka vody?','H₂O',['h2o']],['Veda',200,'Ktorá planéta je najbližšie k Slnku?','Merkúr',['merkur']]];
let names=[],scores=[0,0,0],used=new Set(),active=null,attempted=new Set(),current=-1,selected=-1,deadline=0,timer=null,limit=15,locked=false;
function el(id){return document.getElementById(id)}function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function start(){names=[0,1,2].map(i=>el('p'+i).value.trim()||'Hráč '+(i+1));limit=Math.min(120,Math.max(5,Number(el('seconds').value)||15));scores=[0,0,0];used.clear();current=-1;el('setup').hidden=true;el('game').hidden=false;draw()}
function draw(){el('scores').innerHTML=names.map((n,i)=>`<div class="panel"><div>${escapeHTML(n)}</div><div class="score">${scores[i]} €</div></div>`).join('');el('board').innerHTML='<h2>Ukážková tabuľa</h2><div class="board">'+questions.map((q,i)=>`<button ${used.has(i)?'disabled':''} onclick="choose(${i})">${q[0]}<br>${q[1]} €</button>`).join('')+'</div>'}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){if(used.has(i))return;current=i;used.add(i);attempted.clear();active=null;locked=false;el('question').hidden=false;el('prompt').textContent=questions[i][2];el('result').textContent='';el('entry').hidden=true;el('review').hidden=true;el('info').textContent='Kto odpovedá? Simulácia tlačidiel troch telefónov:';buzz();draw()}
function buzz(){el('buzz').innerHTML=names.map((n,i)=>`<button ${locked||attempted.has(i)?'disabled':''} onclick="selectPlayer(${i})">${escapeHTML(n)} – HLÁSIM SA</button>`).join('')}
function selectPlayer(i){if(locked||attempted.has(i))return;selected=i;active=i;locked=true;el('who').textContent=names[i]+' odpovedá ('+limit+' s)';el('entry').hidden=false;el('answer').value='';el('answer').focus();deadline=Date.now()+limit*1000;clearInterval(timer);timer=setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));el('who').textContent=names[i]+' – zostáva '+left+' s';if(left===0){clearInterval(timer);el('entry').hidden=true;el('result').textContent='Čas vypršal – v tomto deme sa pokus vyhodnotí ako nesprávny.';grade(false)}},100);buzz()}
function submit(){if(active===null||Date.now()>deadline)return;clearInterval(timer);el('entry').hidden=true;let raw=el('answer').value.trim();let q=questions[current];let n=norm(raw);if(q[4].some(a=>norm(a)===n)||norm(q[3])===n){grade(true);return}el('review').hidden=false;el('feedback').textContent='Odpoveď „'+raw+'“ nie je v schválených alternatívach. Správna odpoveď: '+q[3]+'. Rozhodnite spoločne, bez AI API.'}
function grade(ok){clearInterval(timer);if(active===null)return;let i=active;active=null;el('review').hidden=true;el('entry').hidden=true;attempted.add(i);scores[i]+=ok?questions[current][1]:-questions[current][1];el('result').textContent=names[i]+(ok?' správne! +':' nesprávne! −')+questions[current][1]+' €';locked=false;draw();if(ok||attempted.size===3){locked=true;el('info').textContent='Otázka ukončená. Vyber ďalšiu z tabule.';el('buzz').innerHTML=''}else{el('info').textContent='Môže sa prihlásiť ďalší hráč.';buzz()}}
function reset(){clearInterval(timer);el('setup').hidden=false;el('game').hidden=true;el('question').hidden=true}
el('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
</script></body></html>
